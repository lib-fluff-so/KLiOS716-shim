name: KL7 shim host validation

on:
  push:
    branches: [dualboot-modular]
  pull_request:
    branches: [dualboot-modular]

jobs:
  host-and-firmware-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm gcc make python3
      - name: Build default shim and run host tests
        run: |
          make clean
          make -j2 all
          make hosttest loadertest xnutest androidimgtest
      - name: Compile touch-menu image
        run: make -j2 OUT=out-menu MENU_TEST=1 AUTO_REBOOT_TEST=0 all
      - name: Compile Android metadata inspection image
        run: make -j2 OUT=out-android ANDROID_BOOT_TEST=1 AUTO_REBOOT_TEST=0 all
